<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Select Difficulty</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
<ion-radio-group>
  <ion-item *ngFor="let item of items">
    <ion-radio value="{{item}}">{{item}}</ion-radio>
  </ion-item>
</ion-radio-group>

</ion-content>
